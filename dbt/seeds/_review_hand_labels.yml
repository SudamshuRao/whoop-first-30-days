version: 2

seeds:
  - name: review_hand_labels
    description: "Hand labels for WHOOP reviews since the 5.0 launch: one row per review and theme, no review text. split = dev (100, adjudicated), test (60, checklist pass) or test_pass1 (same 60, quick first pass)."
    columns:
      - name: split
        data_tests:
          - accepted_values:
              arguments:
                values: ['dev', 'test', 'test_pass1']
      - name: review_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_reviews')
                field: review_id
      - name: theme
        data_tests:
          - relationships:
              arguments:
                to: ref('review_themes')
                field: theme
