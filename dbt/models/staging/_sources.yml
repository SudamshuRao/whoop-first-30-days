version: 2

sources:
  - name: endomondo
    description: "Endomondo workout metadata from the FitRec project (Ni, Muhlstein & McAuley, WWW 2019), flattened to one row per workout by scripts/flatten_endomondo.py."
    meta:
      external_location: "read_parquet('../data/clean/{name}.parquet')"
    tables:
      - name: endomondo_workouts

  - name: heartsteps
    description: "HeartSteps V1 micro-randomized trial (Klasnja et al., 2019), CC BY 4.0."
    meta:
      external_location: "read_csv('../data/raw/heartsteps/{name}.csv', sample_size = -1)"
    tables:
      - name: suggestions
      - name: users

  - name: reviews
    description: "Public Google Play reviews of the WHOOP app (com.whoop.android), English, US store. Downloaded by scripts/download_reviews.py without reviewer names."
    meta:
      external_location: "read_parquet('../data/raw/reviews/{name}.parquet')"
    tables:
      - name: whoop_google_play
