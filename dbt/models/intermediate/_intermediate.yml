version: 2

models:
  - name: int_endomondo__workout_gaps
    description: "One row per workout with the gap since the member's previous workout."
    columns:
      - name: workout_id
        data_tests: [unique, not_null]

  - name: int_endomondo__lapses
    description: "One row per lapse (gap of lapse_days or more). Open lapses at the data end are censored."
    columns:
      - name: lapse_id
        data_tests: [unique, not_null]
      - name: lapse_days
        data_tests: [not_null]
      - name: is_censored
        data_tests: [not_null]

  - name: int_heartsteps__decision_points
    description: "HeartSteps decision points with study day, study week, travel flag and log-step outcomes."
    columns:
      - name: decision_point_id
        data_tests: [unique, not_null]
